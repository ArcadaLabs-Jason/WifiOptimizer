name: CI

on:
  push:
    branches: [beta, main]
  pull_request:
    branches: [beta, main]

# Read-only: this workflow builds and tests, it never writes to the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to a full commit, so a moved tag cannot change
      # what runs here. The comment says which release that commit is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The built bundle is committed and is what users install, so it has to
      # be exactly what the source builds to.
      - name: Build
        run: pnpm run build

      - name: Committed dist matches the source
        run: git diff --exit-code dist/

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Backend checks
        run: python3 regress.py
