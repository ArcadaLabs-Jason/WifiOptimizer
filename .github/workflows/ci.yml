name: CI

# Pushing to beta or main is itself a release: plugins up to 0.20.0-beta on
# the beta channel install the beta branch as it stands, and install.sh, which
# is read from main, installed main whenever GitHub's API did not answer
# (until 0.24.6). So CI must never be the reason to push either branch. It
# runs on a pushed release tag (which release.sh requires to have passed
# before it publishes), on a pull request, or by hand from the Actions tab,
# and never on a branch push. The branches are moved to the tag only after
# release.sh has published it. A release tag can never be moved, so a release
# commit gets CI before it is tagged, from a draft pull request that is never
# merged; release.sh --pre-tag requires that run to have passed.
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [beta, main]
  workflow_dispatch:

# Read-only: this workflow builds and tests, it never writes to the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to a full commit, so a moved tag cannot change
      # what runs here. The comment says which release that commit is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The built bundle is committed and is what users install, so it has to
      # be exactly what the source builds to.
      - name: Build
        run: pnpm run build

      # git status, not git diff: a file the build makes that was never
      # committed (a new bundle chunk) would be missing from every release,
      # and git diff does not see untracked files.
      - name: Committed dist matches the source
        run: git status --porcelain --untracked-files=all dist/ && test -z "$(git status --porcelain --untracked-files=all dist/)"

      - name: Type check
        run: npx tsc --noEmit -p .

      # Some checks need Linux tools (procps pgrep, flock) and print SKIP on
      # a Mac. Here they must run: the update script a release ships is the
      # one that installs the next release, so it is run end to end here
      # before any tag is published. They run as root, as the plugin and its
      # update script do on a device: the dispatcher's stuck-tool search only
      # looks at root's processes, and its check needs root to start them.
      - name: Backend checks
        env:
          REGRESS_REQUIRE_LINUX: "1"
        run: sudo env "PATH=$PATH" REGRESS_REQUIRE_LINUX=1 python3 regress.py
